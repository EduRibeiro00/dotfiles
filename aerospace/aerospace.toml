# ╔══════════════════════════════════════════════════════════════╗
# ║  AeroSpace — edge-to-edge, vim-style                         ║
# ╚══════════════════════════════════════════════════════════════╝

after-login-command = []

# Run SketchyBar and JankyBorders together with AeroSpace
after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 15
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Edge-to-edge
[gaps]
inner.horizontal = 15
inner.vertical = 15
outer.left = 15
outer.bottom = 15
outer.right = 15
outer.top = [
  { monitor."Built-in *" = 45 }, # built-in monitor
  { monitor."PHL *" = 45}, # home monitor
  45 # default
]

# ┌──────────────────────────────────────────────────────────────┐
# │  Main mode                                                   │
# └──────────────────────────────────────────────────────────────┘
[mode.main.binding]

# Layout
ctrl-alt-cmd-period = 'layout tiles horizontal vertical'
ctrl-alt-cmd-comma = 'layout accordion horizontal vertical'
ctrl-alt-cmd-f = 'fullscreen'

# Focus (vim hjkl) — hyper = caps lock via Raycast
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

# Move windows
shift-ctrl-alt-cmd-h = 'move left'
shift-ctrl-alt-cmd-j = 'move down'
shift-ctrl-alt-cmd-k = 'move up'
shift-ctrl-alt-cmd-l = 'move right'

# Resize
ctrl-alt-cmd-minus = 'resize smart -50'
ctrl-alt-cmd-equal = 'resize smart +50'

# Workspaces — hyper = caps lock via Raycast
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'

# Move to workspace
shift-ctrl-alt-cmd-1 = 'move-node-to-workspace 1'
shift-ctrl-alt-cmd-2 = 'move-node-to-workspace 2'
shift-ctrl-alt-cmd-3 = 'move-node-to-workspace 3'
shift-ctrl-alt-cmd-4 = 'move-node-to-workspace 4'
shift-ctrl-alt-cmd-5 = 'move-node-to-workspace 5'
shift-ctrl-alt-cmd-6 = 'move-node-to-workspace 6'
shift-ctrl-alt-cmd-7 = 'move-node-to-workspace 7'
shift-ctrl-alt-cmd-8 = 'move-node-to-workspace 8'
shift-ctrl-alt-cmd-9 = 'move-node-to-workspace 9'

# Workspace switching — hyper = caps lock via Raycast
ctrl-alt-cmd-space = 'workspace-back-and-forth'
shift-ctrl-alt-cmd-space = 'move-workspace-to-monitor --wrap-around next'

# Enter modes
shift-ctrl-alt-cmd-comma = 'mode service'
ctrl-alt-cmd-r = 'mode resize'

# ┌──────────────────────────────────────────────────────────────┐
# │  Resize mode — hjkl to resize, esc to exit                   │
# └──────────────────────────────────────────────────────────────┘
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
esc = 'mode main'
enter = 'mode main'

# ┌──────────────────────────────────────────────────────────────┐
# │  Service mode — reset, float, join                           │
# └──────────────────────────────────────────────────────────────┘
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

shift-ctrl-alt-cmd-h = ['join-with left', 'mode main']
shift-ctrl-alt-cmd-j = ['join-with down', 'mode main']
shift-ctrl-alt-cmd-k = ['join-with up', 'mode main']
shift-ctrl-alt-cmd-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 1'
