# Set prefix to Ctrl-q (easier to reach than default Ctrl-b)
unbind C-b
set -g prefix C-q
bind C-q send-prefix

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",tmux-256color:Tc"

# Enable mouse support (helpful when learning)
set -g mouse on

# Start window and pane numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable vim mode for copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + o
bind o copy-mode

# In copy mode, use vim keybindings:
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Easy window (tab) creation and navigation
bind c new-window -c "#{pane_current_path}"  # Create new window
bind , command-prompt "rename-window '%%'"    # Rename window
bind n next-window                             # Next window
bind p previous-window                         # Previous window
bind 1 select-window -t 1                      # Jump to window 1
bind 2 select-window -t 2                      # Jump to window 2
bind 3 select-window -t 3                      # Jump to window 3
bind 4 select-window -t 4                      # Jump to window 4
bind 5 select-window -t 5                      # Jump to window 5
bind 6 select-window -t 6                      # Jump to window 6
bind 7 select-window -t 7                      # Jump to window 7
bind 8 select-window -t 8                      # Jump to window 8
bind 9 select-window -t 9                      # Jump to window 9

# Resize panes with vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config easily
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Increase scrollback buffer
set -g history-limit 10000

# Status bar
set -g status-style bg=default,fg=white
set -g status-left "#[fg=#5E81AC,bold][#S] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format "#[fg=#B48EAD] #I:#W "
set -g window-status-current-format "#[fg=#88C0D0,bold] #I:#W "
set -g window-status-current-style bg=default
set -g window-status-style bg=default
